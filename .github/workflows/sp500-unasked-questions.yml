name: Temporary S&P 500 Unasked-Question Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn statsmodels tabulate
      - name: Reconstruct analysis program
        shell: bash
        run: |
          cat > /tmp/analysis.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/analysis.py.gz.b64 | gzip -d > /tmp/analysis.py
          python -m py_compile /tmp/analysis.py
      - name: Run the research
        env:
          OUT_DIR: results
        run: python /tmp/analysis.py
      - name: Package results
        run: |
          cp /tmp/analysis.py results/analysis.py
          sha256sum results/* > results/SHA256SUMS.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sp500-unasked-question-results
          path: results/
          retention-days: 2
          if-no-files-found: error
